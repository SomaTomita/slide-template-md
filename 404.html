<script>
  // GitHub Pages serves this file for any missing path, including nested ones
  // (/repo/foo/bar), where relative links would break. Resolve everything from
  // the site root: the first path segment on *.github.io is the repo name.
  (function(){var seg=location.pathname.split('/').filter(Boolean);var root=/\.github\.io$/.test(location.hostname)&&seg.length?'/'+seg[0]+'/':'/';var b=document.createElement('base');b.setAttribute('href',location.origin+root);document.head.appendChild(b);})();
</script>
